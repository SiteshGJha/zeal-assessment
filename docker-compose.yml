services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zeal
      POSTGRES_PASSWORD: zeal
      POSTGRES_DB: zeal_platform
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeal -d zeal_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      MOCK_UPSTREAM_PORT: 3001
      DATABASE_URL: postgresql://zeal:zeal@postgres:5432/zeal_platform
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-dev-webhook-secret}
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
